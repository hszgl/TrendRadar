name: crawler

on:
  schedule:
    - cron: '0 * * * *'  # 每小时运行一次（整点运行）
  workflow_dispatch:     # 允许手动触发运行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser
    
    - name: Run crawler
      run: python main.py
    
    - name: Send WeWork notification
      if: always()  # 即使爬虫失败也发送通知
      env:
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
      run: |
        python -c "
        import json
        import os
        import requests
        
        webhook_url = os.environ.get('WEWORK_WEBHOOK_URL')
        if not webhook_url:
            print('❌ WEWORK_WEBHOOK_URL not set')
            exit(1)
        
        # 读取输出文件
        try:
            with open('output/hot_news.txt', 'r', encoding='utf-8') as f:
                content = f.read()
        except FileNotFoundError:
            content = '⚠️ Crawler ran but no output found. Check the workflow logs.'
        
        # 构建企业微信消息
        message = {
            'msgtype': 'markdown',
            'markdown': {
                'content': f'## 📊 TrendRadar 热点报告\n\n{content}'
            }
        }
        
        # 发送消息
        try:
            response = requests.post(webhook_url, json=message, timeout=10)
            if response.status_code == 200:
                print('✅ Notification sent successfully')
            else:
                print(f'❌ Failed to send notification: {response.text}')
        except Exception as e:
            print(f'❌ Error sending notification: {e}')
        "
