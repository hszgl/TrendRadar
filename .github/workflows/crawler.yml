name: crawler

on:
  workflow_dispatch:  # 先测试手动触发
  schedule:
    - cron: '0 * * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 手动检出代码（核心）
    - name: Download Repository
      run: |
        echo "📥 Downloading repository..."
        # 使用GitHub API下载仓库
        curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/hszgl/TrendRadar/tarball/main \
          -o repo.tar.gz
        
        # 解压
        tar -xzf repo.tar.gz
        # 复制文件到工作区
        cp -r hszgl-TrendRadar-*/* .
        cp -r hszgl-TrendRadar-*/.[^.]* . 2>/dev/null || true
        
        echo "✅ Repository downloaded"
    
    # 2. 手动设置Python
    - name: Prepare Python
      run: |
        echo "🐍 Python version:"
        python3 --version
        # 确保pip可用
        python3 -m ensurepip --upgrade
        
    # 3. 运行爬虫
    - name: Run Simple Crawler
      run: |
        # 创建最简单的测试脚本
        cat > test.py << 'EOF'
        import requests
        import json
        import os
        from datetime import datetime
        
        print("🚀 Starting simple crawler test...")
        
        # 创建输出目录
        os.makedirs('output', exist_ok=True)
        
        # 收集结果
        result = {
            'status': 'success',
            'timestamp': datetime.now().isoformat(),
            'message': 'Hello from GitHub Actions!',
            'test': 'This is working!'
        }
        
        # 保存结果
        with open('output/test_result.json', 'w') as f:
            json.dump(result, f, indent=2)
        
        print("✅ Test completed!")
        print(json.dumps(result, indent=2))
        EOF
        
        python3 test.py
    
    # 4. 上传结果（可选）
    - name: Upload Results
      run: |
        echo "📤 Uploading results..."
        if [ -f "output/test_result.json" ]; then
          echo "📊 Results found:"
          cat output/test_result.json
          echo "✅ Workflow completed successfully!"
        else
          echo "⚠️ No results found"
        fi
